<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030806"><title>عبدالرحمن شعبان محمد</title>
<style>
:root{--g:#39ff88}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px 15px;background:radial-gradient(ellipse at 50% 10%,#10351f 0%,#06130b 38%,#020503 100%);color:#effff5;font-family:Tahoma,Arial,sans-serif;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.card{position:relative;width:min(100%,430px);padding:34px 24px 27px;text-align:center;border-radius:30px;background:linear-gradient(145deg,rgba(13,38,23,.91),rgba(3,11,6,.94));border:1px solid #39ff8844;box-shadow:0 25px 80px #000b,0 0 45px #00ff7720;backdrop-filter:blur(16px);opacity:0;transform:translateY(35px) scale(.94);animation:enter 1s cubic-bezier(.16,1,.3,1) forwards;overflow:hidden}
.card:before{content:"";position:absolute;inset:-2px;border-radius:inherit;border:1px solid transparent;background:linear-gradient(110deg,transparent,#39ff88aa,transparent,#00bd67aa,transparent) border-box;mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none;animation:shine 5s linear infinite}
.kicker{color:#8cebb0;font-size:10px;letter-spacing:4px;margin:0 0 24px;opacity:0;animation:up .7s .65s forwards}
.portrait{width:170px;height:170px;margin:0 auto 23px;position:relative;display:grid;place-items:center;opacity:0;transform:scale(.65);animation:pop .9s .35s cubic-bezier(.2,1.4,.4,1) forwards}
.ring{position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(var(--g),transparent 25%,#00b96b 55%,transparent 76%,var(--g));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#fff calc(100% - 1px));filter:drop-shadow(0 0 8px var(--g));animation:spin 3.5s linear infinite}
.ring:after{content:"";position:absolute;inset:8px;border:1px dashed #39ff8855;border-radius:50%}.glow{position:absolute;inset:7px;border-radius:50%;background:var(--g);filter:blur(25px);opacity:.25;animation:pulse 2.5s infinite}
.photo{position:relative;z-index:1;width:146px;height:146px;border-radius:50%;object-fit:cover;object-position:center 27%;border:3px solid #0c2818;box-shadow:0 0 0 2px #39ff8899,0 0 28px #39ff8866}
h1{font-size:25px;margin:0 0 8px;opacity:0;animation:up .7s .8s forwards;text-shadow:0 0 18px #39ff8833}.sub{font-size:13px;color:#9ab5a5;margin:0 0 27px;opacity:0;animation:up .7s .95s forwards}
.actions{display:grid;gap:14px}.btn{position:relative;isolation:isolate;overflow:hidden;display:flex;justify-content:center;align-items:center;gap:12px;min-height:61px;padding:15px;border-radius:17px;text-decoration:none;color:#eafff1;font-weight:bold;font-size:16px;background:linear-gradient(115deg,#123b25,#07170d);border:1px solid #39ff8877;box-shadow:inset 0 1px #ffffff12,0 8px 22px #0007,0 0 18px #00ff7718;opacity:0;transform:translateY(18px);animation:up .7s forwards;transition:.25s}
.btn:nth-child(1){animation-delay:1.1s}.btn:nth-child(2){animation-delay:1.25s}.btn:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#39ff8855,transparent 55%);opacity:0;transition:.2s}.btn:hover{transform:translateY(-4px) scale(1.015);border-color:var(--g);box-shadow:0 10px 30px #0008,0 0 28px #39ff8855}.btn:hover:before{opacity:1}.btn:after{content:"";position:absolute;top:-130%;left:-40%;width:25%;height:360%;transform:rotate(25deg);background:linear-gradient(90deg,transparent,#ffffff44,transparent);transition:left .6s}.btn:hover:after{left:130%}.btn:active{transform:scale(.96);box-shadow:0 0 35px #39ff8888}.btn svg{width:23px;height:23px;fill:currentColor;filter:drop-shadow(0 0 6px currentColor)}.ripple{position:absolute;border-radius:50%;background:#8dffb855;transform:scale(0);pointer-events:none;animation:ripple .65s ease-out}
.foot{font-size:10px;letter-spacing:2px;color:#648b72;margin-top:26px;opacity:0;animation:up .7s 1.45s forwards}
@keyframes enter{to{opacity:1;transform:none}}@keyframes up{to{opacity:1;transform:none}}@keyframes pop{to{opacity:1;transform:scale(1)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.4;transform:scale(1.12)}}@keyframes shine{to{filter:hue-rotate(80deg)}}@keyframes ripple{to{transform:scale(4);opacity:0}}
@media(max-width:380px){.card{padding:29px 18px 24px}.portrait{width:155px;height:155px}.photo{width:133px;height:133px}h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style></head><body>
